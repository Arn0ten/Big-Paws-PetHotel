# Docker Compose configuration for Big-Paws Pet Boarding Application
# This file sets up the application and its dependencies as services

version: '3.8'

services:
  # Web application service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Add your environment variables here
      # - DATABASE_URL=postgres://user:password@db:5432/big_paws
      # - NEXT_PUBLIC_API_URL=http://localhost:3000/api
    depends_on:
      - db
    restart: unless-stopped
    # For development, uncomment these lines to enable hot reloading
    # volumes:
    #   - ./:/app
    #   - /app/node_modules
    #   - /app/.next

  # Database service (PostgreSQL example)
  db:
    image: postgres:14-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=big_paws
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # Add additional services as needed (Redis, Elasticsearch, etc.)
  # redis:
  #   image: redis:alpine
  #   ports:
  #     - "6379:6379"
  #   restart: unless-stopped

volumes:
  postgres_data:

# CONFIGURATION GUIDE:
# 1. Adjust the database service based on your needs (PostgreSQL, MySQL, MongoDB)
# 2. Configure environment variables for each service
# 3. For development, uncomment the volumes section in the app service
# 4. Add additional services as needed (Redis, Elasticsearch, etc.)
# 5. Start all services: docker-compose up
# 6. For production, consider using docker-compose.prod.yml with optimized settings
# 7. Run in detached mode: docker-compose up -d

