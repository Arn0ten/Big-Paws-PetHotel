version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - MAILGUN_API_KEY=${MAILGUN_API_KEY}
      - MAILGUN_DOMAIN=${MAILGUN_DOMAIN}
      - POSTMARK_API_KEY=${POSTMARK_API_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:14-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=bigpaws
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:

# CONFIGURATION GUIDE:
# 1. This docker-compose file sets up both the Next.js application and a PostgreSQL database
# 2. Environment variables are passed from the host to the containers
# 3. Data is persisted using a named volume for the database
# 4. To start: docker-compose up -d
# 5. To stop: docker-compose down
# 6. For development, you may want to add a volume mount for the app service:
#    volumes:
#      - .:/app
#      - /app/node_modules
#      - /app/.next

