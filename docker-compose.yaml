version: '3.8'

services:
  # Web application service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - MAILGUN_API_KEY=${2cdce7f1940a1b40335b4ad68ffebd18-3af52e3b-22961c93}
      - MAILGUN_DOMAIN=${bigpawspethotel.tech}
      - POSTMARK_API_KEY=${5e1444e3-0235-4c2b-8086-baeca18fec07}
      - RESEND_API_KEY=${re_9EmmCig4_5etMbwZedgeuKfkXjdsKjTKD}

      # Add other environment variables as needed
    depends_on:
      - db
    restart: unless-stopped
    # For development, uncomment these lines to enable hot reloading
    # volumes:
    #   - ./:/app
    #   - /app/node_modules
    #   - /app/.next

  # Database service (PostgreSQL example)
  db:
    image: postgres:14-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-big_paws_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # Add additional services as needed (Redis, etc.)
  # redis:
  #   image: redis:alpine
  #   ports:
  #     - "6379:6379"
  #   restart: unless-stopped

volumes:
  postgres_data:

